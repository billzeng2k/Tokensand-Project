name: tokensand
services:
  singlestore:
    image: ghcr.io/singlestore-labs/singlestoredb-dev@sha256:2d48d273e138a5fce30e48b8353a3a4c132eabf9f42aff838694bbae2291439c
    platform: linux/amd64
    cpus: 4
    mem_limit: 8g
    environment:
      ROOT_PASSWORD: ${SINGLESTORE_ROOT_PASSWORD:?Run python3 scripts/setup.py first}
    ports:
      - "127.0.0.1:3307:3306"
      - "127.0.0.1:8088:8080"
      - "127.0.0.1:9008:9000"
    volumes:
      - singlestore-compat-data:/data
    restart: unless-stopped
volumes:
  singlestore-compat-data:
